<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duru — Kariyer Keşif Testi</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-strong: #1c5cab;
    --accent-soft: #cde2fb;
    --seq-250: #86b6ef;
    --seq-400: #3987e5;
    --seq-500: #256abf;
    --seq-650: #104281;
    --good: #006300;
    --s1: #2a78d6; /* R */
    --s2: #008300; /* I */
    --s3: #e87ba4; /* A */
    --s4: #eda100; /* S */
    --s5: #1baf7a; /* E */
    --s6: #eb6834; /* C */
    --card-shadow: 0 1px 3px rgba(11,11,11,0.06), 0 4px 16px rgba(11,11,11,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --accent-strong: #86b6ef;
      --accent-soft: #12345c;
      --seq-250: #86b6ef;
      --seq-400: #3987e5;
      --seq-500: #256abf;
      --seq-650: #6da7ec;
      --good: #0ca30c;
      --s1: #3987e5;
      --s2: #008300;
      --s3: #d55181;
      --s4: #c98500;
      --s5: #199e70;
      --s6: #d95926;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.55;
    min-height: 100vh;
  }
  .shell { max-width: 780px; margin: 0 auto; padding: 20px 16px 80px; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--page);
    padding: 12px 0 10px;
    border-bottom: 1px solid var(--grid);
    margin-bottom: 22px;
  }
  .topbar-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
  .brand span { color: var(--accent); }
  .step-label { font-size: 12.5px; color: var(--muted); }
  .progress-track {
    margin-top: 10px; height: 6px; border-radius: 4px;
    background: var(--grid); overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    border-radius: 4px;
    transition: width .35s ease;
  }
  .section-chip {
    display: inline-block; font-size: 12px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
  }
  h1 { font-size: 26px; line-height: 1.25; margin-bottom: 10px; }
  h2 { font-size: 20px; line-height: 1.3; margin-bottom: 6px; }
  h3 { font-size: 16px; margin-bottom: 4px; }
  .lede { color: var(--text-secondary); font-size: 15px; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 18px;
    margin-bottom: 14px;
    box-shadow: var(--card-shadow);
  }
  .intro-list { margin: 14px 0 18px; padding-left: 0; list-style: none; }
  .intro-list li {
    padding: 9px 0 9px 30px; position: relative;
    color: var(--text-secondary); font-size: 14.5px;
    border-bottom: 1px dashed var(--grid);
  }
  .intro-list li:last-child { border-bottom: none; }
  .intro-list li::before {
    content: ""; position: absolute; left: 4px; top: 15px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
  }
  .golden-rules {
    background: var(--accent-soft);
    border-radius: 12px; padding: 14px 16px; margin: 16px 0 20px;
    font-size: 14.5px; color: var(--text-primary);
  }
  .golden-rules strong { display: block; margin-bottom: 6px; }
  .golden-rules ul { padding-left: 18px; }
  .golden-rules li { margin: 4px 0; }
  .btn {
    display: inline-block;
    font: inherit; font-weight: 600; font-size: 15.5px;
    padding: 12px 28px; border-radius: 12px;
    border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    transition: transform .08s ease, opacity .15s;
  }
  .btn:hover { opacity: .92; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
  .btn-ghost {
    background: transparent; color: var(--text-secondary);
    border: 1px solid var(--baseline);
  }
  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; }
  .unanswered-note { font-size: 13px; color: var(--muted); margin-top: 10px; text-align: right; min-height: 18px; }

  /* Likert */
  .likert-item { padding: 16px 2px 14px; border-bottom: 1px solid var(--grid); }
  .likert-item:last-child { border-bottom: none; }
  .likert-q { font-size: 15.5px; font-weight: 550; margin-bottom: 12px; }
  .likert-scale { display: flex; gap: 6px; }
  .likert-opt {
    flex: 1; text-align: center; cursor: pointer;
    border: 1.5px solid var(--baseline); border-radius: 10px;
    padding: 9px 2px 7px; font-size: 11px; color: var(--muted);
    user-select: none; transition: all .12s ease; line-height: 1.25;
    background: transparent;
  }
  .likert-opt .dot {
    display: block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--baseline); margin: 0 auto 5px;
    transition: all .12s ease;
  }
  .likert-opt:hover { border-color: var(--accent); color: var(--text-secondary); }
  .likert-opt.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--text-primary); font-weight: 600; }
  .likert-opt.sel .dot { background: var(--accent); border-color: var(--accent); }

  /* Choice cards (scenario / forced / multi) */
  .choice {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1.5px solid var(--baseline); border-radius: 12px;
    padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
    transition: all .12s ease; font-size: 14.5px; user-select: none;
    background: transparent;
  }
  .choice:hover { border-color: var(--accent); }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); }
  .choice .radio {
    flex: 0 0 18px; width: 18px; height: 18px; margin-top: 2px;
    border: 2px solid var(--baseline); border-radius: 50%;
    transition: all .12s ease;
  }
  .choice.multi .radio { border-radius: 5px; }
  .choice.sel .radio { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface-1); }
  .choice.multi.sel .radio { box-shadow: none; background: var(--accent); }
  .choice.disabled { opacity: .45; cursor: not-allowed; }

  /* Forced choice A/B */
  .ab-q { font-size: 15px; font-weight: 550; margin: 14px 0 10px; }
  .ab-row { display: flex; gap: 10px; }
  .ab-opt {
    flex: 1; border: 1.5px solid var(--baseline); border-radius: 12px;
    padding: 12px 13px; font-size: 13.5px; cursor: pointer;
    transition: all .12s ease; user-select: none; text-align: center;
    color: var(--text-secondary);
  }
  .ab-opt:hover { border-color: var(--accent); }
  .ab-opt.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--text-primary); font-weight: 600; }

  /* Rank */
  .rank-card {
    display: flex; align-items: center; gap: 14px;
    border: 1.5px solid var(--baseline); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 10px; cursor: pointer;
    transition: all .12s ease; user-select: none;
  }
  .rank-card:hover { border-color: var(--accent); }
  .rank-card.ranked { border-color: var(--accent); background: var(--accent-soft); }
  .rank-num {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
    border: 2px dashed var(--baseline);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: var(--muted);
  }
  .rank-card.ranked .rank-num { border: none; background: var(--accent); color: #fff; }
  .rank-title { font-weight: 650; font-size: 14.5px; }
  .rank-desc { font-size: 13px; color: var(--text-secondary); }

  /* Confidence rows */
  .conf-row { padding: 12px 2px; border-bottom: 1px solid var(--grid); }
  .conf-row:last-child { border-bottom: none; }
  .conf-label { font-size: 14.5px; font-weight: 550; margin-bottom: 8px; }
  .conf-scale { display: flex; gap: 6px; }
  .conf-opt {
    flex: 1; text-align: center; cursor: pointer;
    border: 1.5px solid var(--baseline); border-radius: 8px;
    padding: 7px 0; font-size: 12.5px; color: var(--muted);
    user-select: none; transition: all .12s;
  }
  .conf-opt:hover { border-color: var(--accent); }
  .conf-opt.sel { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }

  textarea {
    width: 100%; min-height: 84px; resize: vertical;
    font: inherit; font-size: 14.5px;
    color: var(--text-primary); background: var(--surface-1);
    border: 1.5px solid var(--baseline); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 4px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .open-q { font-size: 15px; font-weight: 600; margin: 18px 0 8px; }
  .open-q:first-child { margin-top: 4px; }

  /* ===== Results ===== */
  .res-header { text-align: center; margin-bottom: 24px; }
  .res-header h1 { margin-bottom: 4px; }
  .res-date { color: var(--muted); font-size: 13px; }
  .code-badge {
    display: inline-flex; gap: 8px; margin: 14px 0 4px;
  }
  .code-letter {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: #fff;
  }
  .code-name { font-size: 15px; font-weight: 650; color: var(--text-secondary); }
  .bar-row { display: grid; grid-template-columns: 132px 1fr 44px; gap: 10px; align-items: center; padding: 7px 0; }
  .bar-label { font-size: 13.5px; font-weight: 600; text-align: right; color: var(--text-secondary); }
  .bar-track { height: 18px; background: var(--grid); border-radius: 0 4px 4px 0; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; transition: width .6s ease; }
  .bar-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .axis-wrap { margin: 14px 0; }
  .axis-labels { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
  .axis-track { height: 10px; border-radius: 6px; background: var(--grid); position: relative; }
  .axis-knob {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--surface-1);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .cluster-card { border: 1px solid var(--border); border-radius: 14px; padding: 16px 16px 12px; margin-bottom: 12px; background: var(--surface-1); box-shadow: var(--card-shadow); }
  .cluster-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .cluster-rank {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
  }
  .cluster-title { font-size: 16.5px; font-weight: 700; flex: 1; }
  .cluster-pct { font-size: 17px; font-weight: 800; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
  .cluster-bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin-bottom: 10px; }
  .cluster-bar div { height: 100%; border-radius: 4px; }
  .cluster-note { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 10px; }
  .job-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .job-item { display: flex; align-items: baseline; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .job-name { font-weight: 600; }
  .job-en { color: var(--muted); font-size: 12.5px; }
  .badge {
    font-size: 11px; font-weight: 700; padding: 1.5px 8px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong); white-space: nowrap;
  }
  .skill-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill-chip {
    font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
    border: 1px solid var(--baseline); border-radius: 20px; padding: 2px 10px;
  }
  .mini-clusters { display: flex; flex-direction: column; gap: 6px; }
  .mini-row { display: grid; grid-template-columns: 1fr 90px 40px; gap: 10px; align-items: center; font-size: 13.5px; }
  .mini-track { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
  .mini-track div { height: 100%; background: var(--seq-250); border-radius: 4px; }
  .flag {
    border-left: 4px solid var(--s4); background: var(--surface-1);
    border-radius: 0 12px 12px 0; padding: 12px 14px; margin: 10px 0;
    font-size: 14px; color: var(--text-secondary);
  }
  .flag strong { color: var(--text-primary); }
  .copy-box {
    background: var(--accent-soft); border-radius: 14px; padding: 18px; text-align: center; margin-top: 8px;
  }
  .copy-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
  .footer-note { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 26px; line-height: 1.6; }
  @media (max-width: 560px) {
    .likert-opt { font-size: 9.5px; padding: 7px 1px 6px; }
    .bar-row { grid-template-columns: 104px 1fr 40px; }
    .bar-label { font-size: 12px; }
    h1 { font-size: 22px; }
    .ab-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar" id="topbar" style="display:none">
    <div class="topbar-row">
      <div class="brand">Duru <span>· Kariyer Keşif Testi</span></div>
      <div class="step-label" id="stepLabel"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div id="app"></div>
</div>
<script>
/* ============ VERİ ============ */
const RIASEC_META = {
  R: { name: "Yapıcı",      en: "Realistic",     color: "var(--s1)", hex: "#2a78d6", desc: "Elle ve araçlarla somut şeyler üretmeyi, kurmayı, çalıştırmayı sever." },
  I: { name: "Araştırmacı", en: "Investigative", color: "var(--s2)", hex: "#008300", desc: "Anlamayı, analiz etmeyi, problem çözmeyi ve keşfetmeyi sever." },
  A: { name: "Yaratıcı",    en: "Artistic",      color: "var(--s3)", hex: "#e87ba4", desc: "Özgün fikirler üretmeyi, tasarlamayı ve kendini ifade etmeyi sever." },
  S: { name: "Sosyal",      en: "Social",        color: "var(--s4)", hex: "#eda100", desc: "İnsanlara yardım etmeyi, öğretmeyi ve birlikte çalışmayı sever." },
  E: { name: "Girişimci",   en: "Enterprising",  color: "var(--s5)", hex: "#1baf7a", desc: "Liderlik etmeyi, ikna etmeyi ve hedefe yönelik risk almayı sever." },
  C: { name: "Düzenleyici", en: "Conventional",  color: "var(--s6)", hex: "#eb6834", desc: "Düzen kurmayı, veriyle çalışmayı ve sistemli ilerlemeyi sever." }
};

const LIKERT_ITEMS = [
  { id:"L1",  t:"R", text:"Bir drone'u parçalarından birleştirip uçurmak" },
  { id:"L2",  t:"I", text:"Bir veri setini inceleyip içindeki gizli örüntüyü bulmak" },
  { id:"L3",  t:"A", text:"Bir uygulamanın görünümünü ve arayüzünü tasarlamak" },
  { id:"L4",  t:"S", text:"Küçük bir öğrenciye anlamadığı konuyu anlayana kadar anlatmak" },
  { id:"L5",  t:"E", text:"Bir ürün fikrini jüri önünde sunmak" },
  { id:"L6",  t:"C", text:"Bir etkinliğin ayrıntılı planını ve kontrol listesini hazırlamak" },
  { id:"L7",  t:"R", text:"Kendi oyun bilgisayarını parçalarını seçerek toplamak" },
  { id:"L8",  t:"I", text:"Bir yapay zekâ modelinin neden yanlış cevap verdiğini bulmaya çalışmak" },
  { id:"L9",  t:"A", text:"Kendi hikâyenle bir video çekip kurgulamak" },
  { id:"L10", t:"S", text:"Arkadaşlarının kişisel sorunlarını dinleyip destek olmak" },
  { id:"L11", t:"E", text:"Okul etkinliği için bir firmayla sponsorluk görüşmesi yapmak" },
  { id:"L12", t:"C", text:"Bir kulübün bütçesini ve harcamalarını tabloda takip etmek" },
  { id:"L13", t:"R", text:"3D yazıcıyla çalışan bir parça tasarlayıp basmak" },
  { id:"L14", t:"I", text:"Laboratuvarda deney yapıp sonuçlarını analiz etmek" },
  { id:"L15", t:"A", text:"Bir oyunun dünyasını ve karakterlerini hayal edip tasarlamak" },
  { id:"L16", t:"S", text:"Bir gönüllülük projesinde insanlara doğrudan yardım etmek" },
  { id:"L17", t:"E", text:"Bir proje ekibini yönetip görev dağılımı yapmak" },
  { id:"L18", t:"C", text:"Dağınık bir dijital arşivi herkesin kolayca bulacağı şekilde düzenlemek" },
  { id:"L19", t:"R", text:"Bozulan bir cihazı söküp arızayı bulmak ve onarmak" },
  { id:"L20", t:"I", text:"Zor bir matematik problemini farklı yollarla çözmeyi denemek" },
  { id:"L21", t:"A", text:"Resim, illüstrasyon veya dijital çizim yapmak" },
  { id:"L22", t:"S", text:"Yeni gelen birine ortamı tanıtıp uyum sağlamasına yardımcı olmak" },
  { id:"L23", t:"E", text:"Bir tartışmada insanları kendi fikrine ikna etmek" },
  { id:"L24", t:"C", text:"Karmaşık verileri düzenli ve okunaklı tablolara dönüştürmek" },
  { id:"L25", t:"R", text:"Bir robotun mekanik parçalarını kurup çalıştırmak" },
  { id:"L26", t:"I", text:"Mikroskopla hücre veya doku örnekleri incelemek" },
  { id:"L27", t:"A", text:"Müzik bestelemek, düzenlemek veya bir enstrüman çalmak" },
  { id:"L28", t:"S", text:"Bir topluluğu (kulüp ya da online) yönetip kaynaştırmak" },
  { id:"L29", t:"E", text:"Kendi işini/girişimini kurma fikri üzerinde çalışmak" },
  { id:"L30", t:"C", text:"Bir işin adım adım nasıl yapılacağını anlatan rehber yazmak" },
  { id:"L31", t:"R", text:"Elektronik bir devre kurup çalıştırmak" },
  { id:"L32", t:"I", text:"Yeni bir hastalık tedavisinin nasıl geliştirildiğini derinlemesine araştırmak" },
  { id:"L33", t:"A", text:"Şiir, öykü veya senaryo yazmak" },
  { id:"L34", t:"S", text:"Sağlık ya da afet gönüllüsü olarak sahada çalışmak" },
  { id:"L35", t:"E", text:"Sosyal medyada bir etkinliği tanıtıp kalabalık toplamak" },
  { id:"L36", t:"C", text:"Uzun vadeli bir hedefi küçük görevlere bölüp takvimlendirmek" }
];

const SCENARIOS = [
  { id:"SC1", q:"Okul takımınla girdiğin bir yarışma projesi teslimden iki gün önce dağıldı. İlk içgüdün hangisi olurdu?",
    opts:[
      { t:"R", text:"Prototipi masaya yatırır, elimle çalışır hale getiririm" },
      { t:"I", text:"Nerede hata yaptığımızı bulmak için veriyi ve tasarımı yeniden analiz ederim" },
      { t:"A", text:"Projenin sunumunu ve hikâyesini baştan yaratıcı şekilde kurgularım" },
      { t:"S", text:"Panikleyen ekibi toparlar, moral ve görevleri yeniden düzenlerim" },
      { t:"E", text:"Öğretmenle/jüriyle konuşup ek süre için ikna etmeyi denerim" },
      { t:"C", text:"Kalan tüm işleri listeler, saat saat kim ne yapacak planlarım" }
    ]},
  { id:"SC2", q:"Büyük bir bilim-teknoloji fuarında tek başına bir öğleden sonran var. En çok nereye gidersin?",
    opts:[
      { t:"R", text:"Robotların ve makinelerin kurcalanabildiği atölye standına" },

  data.scenarios.forEach(sc => {
    const sel = answers.scenarios[sc.id];
    if (typeof sel === "number") raw[sc.opts[sel].t] += 3;
    Object.keys(max).forEach(k => max[k] += 3);
  });
  // Akış soruları: seçilen her tip +2.
  // Tip başına ulaşılabilir maksimum: o tipin seçenek sayısı ile soru limitinin küçüğü.
  data.flow.forEach(fq => {
    const sels = answers.flow[fq.id] || [];
    sels.forEach(i => { raw[fq.opts[i].t] += 2; });
    Object.keys(max).forEach(k => {
      const optCount = fq.opts.filter(o => o.t === k).length;
      max[k] += 2 * Math.min(optCount, fq.max);
    });
  });
  const pct = {};
  Object.keys(raw).forEach(k => { pct[k] = max[k] ? Math.round(100 * raw[k] / max[k]) : 0; });
  const sorted = Object.keys(pct).sort((a, b) => pct[b] - pct[a] || a.localeCompare(b));
  const vals = Object.values(pct);
  const spread = Math.max(...vals) - Math.min(...vals);
  return { raw, pct, code: sorted.slice(0, 3), sorted, spread, lowDifferentiation: spread < 15 };
}

function computeAxes(answers, data) {
  // people-things: -1..+1 (+ = insan, - = nesne); data-ideas: (+ = fikir, - = veri)
  let pt = 0, ptN = 0, di = 0, diN = 0;
  data.prediger.forEach(p => {
    const sel = answers.prediger[p.id]; // "a" | "b"
    if (!sel) return;
    const side = p[sel].side;
    if (p.axis === "pt") { ptN++; pt += (side === "people" ? 1 : -1); }
    else { diN++; di += (side === "ideas" ? 1 : -1); }
  });
  return {
    peopleThings: ptN ? pt / ptN : 0,   // +1 tam insan, -1 tam nesne
    dataIdeas: diN ? di / diN : 0       // +1 tam fikir, -1 tam veri
  };
}

function computeConfidence(answers, data) {
  const out = {};
  data.conf.forEach(c => { out[c.id] = answers.conf[c.id]; }); // 1..5
  return out;
}

function computeClusters(answers, data, riasecPct) {
  const results = data.clusters.map(cl => {
    // 1) RIASEC uyumu (ağırlıklı ortalama, 0-1)
    let wSum = 0, wTot = 0;
    Object.entries(cl.riasec).forEach(([letter, w]) => {
      wSum += w * (riasecPct[letter] / 100);
      wTot += w;
    });
    const riasecScore = wTot ? wSum / wTot : 0;
    // 2) Teknoloji ilgisi (0-1)
    const selTech = answers.techs || [];
    const techMatches = cl.tech.filter(t => selTech.includes(t)).length;
    const techScore = cl.tech.length === 0 ? 0.5 : (techMatches > 0 ? 1 : 0);
    // 3) Dünya sorunu ilgisi (0-1)
    const selProb = answers.problems || [];
    const probMatches = cl.problems.filter(p => selProb.includes(p)).length;
    const probScore = cl.problems.length === 0 ? 0.5 : (probMatches > 0 ? 1 : 0);
    // 4) Güven (0-1): ilgili alanlardaki öz-yeterlik, 1-5 → 0-1
    const confVals = cl.conf.map(k => answers.conf[k]).filter(v => typeof v === "number");
    const confScore = confVals.length ? (confVals.reduce((a, b) => a + b, 0) / confVals.length - 1) / 4 : 0.5;
    const total = 0.50 * riasecScore + 0.15 * techScore + 0.10 * probScore + 0.25 * confScore;
    // Koçluk bayrağı: ilgi güçlü ama güven düşük
    const interestHighConfLow = riasecScore >= 0.55 && confScore < 0.45;
    return { id: cl.id, name: cl.name, pct: Math.round(100 * total),
             riasecScore, techScore, probScore, confScore, interestHighConfLow };
  });
  results.sort((a, b) => b.pct - a.pct || a.name.localeCompare(b.name, "tr"));
  return results;
}

function computeAll(answers, data) {
  const riasec = computeRiasec(answers, data);
  const axes = computeAxes(answers, data);
  const conf = computeConfidence(answers, data);
  const clusters = computeClusters(answers, data, riasec.pct);
  return { riasec, axes, conf, clusters };
}
/*SCORING-END*/
</script>

function renderResults() {
  const R = computeAll(state.answers, DATA);
  const { riasec, axes, clusters } = R;
  const dateStr = new Date().toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  const codeStr = riasec.code.join("");
  const codeNames = riasec.code.map(l => RIASEC_META[l].name).join(" · ");

  const riasecBars = riasec.sorted.map(l => {
    const m = RIASEC_META[l];
    return `<div class="bar-row">
      <div class="bar-label">${m.name} <span style="color:var(--muted); font-weight:400">(${l})</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${riasec.pct[l]}%; background:${m.color}"></div></div>
      <div class="bar-val">%${riasec.pct[l]}</div>
    </div>`;
  }).join("");

  const topMeta = RIASEC_META[riasec.code[0]];
  const axisPos = v => (50 + v * 45) + "%";

  const valuesTop = state.answers.values.slice(0, 3).map((id, i) => {
    const v = VALUES.find(x => x.id === id);
    return `<div class="job-item"><span class="badge">${i + 1}</span><span class="job-name">${esc(v.title)}</span><span class="job-en">${esc(v.desc)}</span></div>`;
  }).join("");

  const envSummary = ENV_PREFS.map(e => {
    const sel = state.answers.env[e.id];
    return sel ? `<span class="skill-chip">${esc(sel === "a" ? e.a : e.b)}</span>` : "";
  }).join("");

  const confBars = CONF_ITEMS.map(c => {
    const v = state.answers.conf[c.id] || 0;
    return `<div class="mini-row">
      <span>${esc(c.text)}</span>
      <div class="mini-track"><div style="width:${(v / 5) * 100}%; background:var(--seq-400)"></div></div>
      <span style="font-weight:700; font-variant-numeric:tabular-nums">${v}/5</span>
    </div>`;
  }).join("");

  const top5 = clusters.slice(0, 5);
  const rest = clusters.slice(5);
  const clusterCards = top5.map((c, i) => {
    const cl = CLUSTERS.find(x => x.id === c.id);
    return `<div class="cluster-card">
      <div class="cluster-head">
        <div class="cluster-rank">${i + 1}</div>
        <div class="cluster-title">${esc(cl.name)}</div>
        <div class="cluster-pct">%${c.pct}</div>
      </div>
      <div class="cluster-bar"><div style="width:${c.pct}%; background:var(--seq-400)"></div></div>
      <div class="cluster-note">${esc(cl.note)}</div>
      <div class="job-list">
        ${cl.jobs.map(j => `<div class="job-item"><span class="job-name">${esc(j.name)}</span><span class="job-en">${esc(j.en)}</span><span class="badge">${esc(j.badge)}</span></div>`).join("")}
      </div>
      <div class="skill-chips">${cl.skills.map(s => `<span class="skill-chip">2030 becerisi: ${esc(s)}</span>`).join("")}</div>
      ${c.interestHighConfLow ? `<div class="flag" style="margin-top:10px"><strong>Not:</strong> İlgin güçlü ama bu alandaki kendine güvenin şimdilik düşük. Bu bir engel değil, gelişim alanı — küçük bir deneme projesiyle test etmeye değer.</div>` : ""}
    </div>`;
  }).join("");

  const restRows = rest.map(c => `
    <div class="mini-row">
      <span>${esc(c.name)}</span>
      <div class="mini-track"><div style="width:${c.pct}%"></div></div>
      <span style="font-weight:700; font-variant-numeric:tabular-nums">%${c.pct}</span>
    </div>`).join("");

  app.innerHTML = `
  <div class="res-header">
    <span class="section-chip">Sonuçlar</span>
    <h1>Duru'nun Keşif Profili</h1>
    <div class="res-date">${dateStr}</div>
    <div class="code-badge">
      ${riasec.code.map(l => `<div class="code-letter" style="background:${RIASEC_META[l].color}">${l}</div>`).join("")}
    </div>
    <div class="code-name">${codeStr} — ${codeNames}</div>
    <p class="lede" style="max-width:520px; margin:10px auto 0; font-size:14px">${esc(topMeta.desc)}</p>
  </div>

  ${riasec.lowDifferentiation ? `<div class="flag"><strong>Profil notu:</strong> İlgi puanların birbirine çok yakın çıktı (düz profil). Bu, "her şeye biraz açığım" demek — sonuçları kesin hüküm gibi değil, keşfe devam işareti olarak oku. Açık uçlu cevaplar ve derin analiz bu durumda daha da önemli.</div>` : ""}

  <div class="card">
    <h3 style="margin-bottom:10px">İlgi Profilin (RIASEC)</h3>
    ${riasecBars}
    <p class="hint" style="margin:10px 0 0">En yüksek 2-3 harf senin "Holland kodun". Araştırmalar, ilgi profiline uyan bölüm seçenlerin daha başarılı ve kalıcı olduğunu gösteriyor.</p>
  </div>

  <div class="card">
    <h3 style="margin-bottom:6px">Çalışma Tarzın</h3>
    <div class="axis-wrap">
      <div class="axis-labels"><span>Nesnelerle / teknikle</span><span>İnsanlarla</span></div>
      <div class="axis-track"><div class="axis-knob" style="left:${axisPos(axes.peopleThings)}"></div></div>
    </div>
    <div class="axis-wrap">
      <div class="axis-labels"><span>Veri ve düzenle</span><span>Fikir ve olasılıklarla</span></div>
      <div class="axis-track"><div class="axis-knob" style="left:${axisPos(axes.dataIdeas)}"></div></div>
    </div>
    <h3 style="margin:16px 0 8px">Tercih Ettiğin Ortam</h3>
    <div class="skill-chips">${envSummary}</div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px">En Önemli Değerlerin</h3>
    <div class="job-list">${valuesTop}</div>
    <p class="hint" style="margin-top:8px">İlgiler hangi alanı seçeceğini söyler; değerler o alanda mutlu olup olmayacağını öngörür.</p>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px">Kendine Güven Haritan</h3>
    <div class="mini-clusters">${confBars}</div>
  </div>

  <h2 style="margin:26px 0 4px">Sana En Uygun Gelecek Meslek Kümeleri</h2>
  <p class="hint">Uyum skoru: %50 ilgi profili + %25 kendine güven + %25 teknoloji ve dünya sorunu ilgisi. Kaynaklar: WEF Future of Jobs 2025, ABD BLS 2024-34 projeksiyonları, LinkedIn Jobs on the Rise 2025-26.</p>
  ${clusterCards}

  <div class="card">
    <h3 style="margin-bottom:10px">Diğer Kümeler</h3>
    <div class="mini-clusters">${restRows}</div>
  </div>

  <div class="copy-box">
    <h3>Sıradaki adım: derin analiz</h3>
    <p>Aşağıdaki düğme tüm cevaplarını ve skorlarını panoya kopyalar. Metni Claude'a yapıştır — profilini derinlemesine yorumlayıp meslek ve ülke/okul önerilerine dönüştürelim.</p>
    <button class="btn" onclick="copyResults(this)">Sonuçları Kopyala 📋</button>
  </div>

  <div class="nav-row">
    <button class="btn btn-ghost" onclick="goBack()">← Cevaplara Dön</button>
    <button class="btn btn-ghost" onclick="restart()">Testi Sıfırla</button>
  </div>

  <p class="footer-note">Bu test bir hüküm değil, bir keşif haritasıdır. Metodoloji: Holland RIASEC ilgi modeli, O*NET iş değerleri, Prediger çalışma tarzı eksenleri, akış göstergeleri ve öz-yeterlik.<br>Meslek verileri: WEF Future of Jobs Report 2025 · ABD BLS Employment Projections 2024-34 · LinkedIn Jobs on the Rise 2025-26 · McKinsey Global Institute.</p>`;
}

function restart() {
  if (!confirm("Tüm cevaplar silinecek. Emin misin?")) return;
  state.page = 0;
  state.answers = { likert:{}, scenarios:{}, prediger:{}, env:{}, values:[], flow:{}, conf:{}, problems:[], techs:[], open:{} };
  render();
}

function buildExport() {
  const R = computeAll(state.answers, DATA);
  const a = state.answers;
  const L = [];
  L.push("=== DURU — KARİYER KEŞİF TESTİ SONUÇLARI ===");
  L.push("Tarih: " + new Date().toLocaleDateString("tr-TR"));
  L.push("");
  L.push("— RIASEC PROFİLİ —");
  L.push("Holland kodu: " + R.riasec.code.join("") + " (" + R.riasec.code.map(l => RIASEC_META[l].name).join("-") + ")");
  R.riasec.sorted.forEach(l => L.push(`  ${l} ${RIASEC_META[l].name} (${RIASEC_META[l].en}): %${R.riasec.pct[l]}`));
  L.push("Farklılaşma (max-min): " + R.riasec.spread + (R.riasec.lowDifferentiation ? " — DÜŞÜK (düz profil, dikkat)" : ""));
  L.push("");
  L.push("— ÇALIŞMA TARZI EKSENLERİ —");
  L.push("İnsan(+1)↔Nesne(-1): " + R.axes.peopleThings.toFixed(2));
  L.push("Fikir(+1)↔Veri(-1): " + R.axes.dataIdeas.toFixed(2));
  L.push("Ortam tercihleri:");
  ENV_PREFS.forEach(e => { const s = a.env[e.id]; if (s) L.push("  · " + (s === "a" ? e.a : e.b)); });
  L.push("");
  L.push("— DEĞER SIRALAMASI (1=en önemli) —");
  a.values.forEach((id, i) => { const v = VALUES.find(x => x.id === id); L.push(`  ${i + 1}. ${v.title} (${v.en})`); });
  L.push("");
  L.push("— KENDİNE GÜVEN (1-5) —");
  CONF_ITEMS.forEach(c => L.push(`  ${c.text}: ${a.conf[c.id] || "-"}`));
  L.push("");
  L.push("— DÜNYA SORUNLARI (seçilen) —");
  (a.problems || []).forEach(id => L.push("  · " + PROBLEMS.find(p => p.id === id).text));
  L.push("— HEYECANLANDIRAN TEKNOLOJİLER —");
  (a.techs || []).forEach(id => L.push("  · " + TECHS.find(t => t.id === id).text));
  L.push("");
  L.push("— MESLEK KÜMESİ UYUM SKORLARI —");
  R.clusters.forEach((c, i) => L.push(`  ${i + 1}. ${c.name}: %${c.pct} (ilgi ${Math.round(c.riasecScore * 100)}, güven ${Math.round(c.confScore * 100)}, tek ${c.techScore}, sorun ${c.probScore})${c.interestHighConfLow ? " [ilgi yüksek/güven düşük]" : ""}`));
  L.push("");
  L.push("— AKIŞ SORULARI SEÇİMLERİ —");
  FLOW_QS.forEach(fq => {
    const sels = a.flow[fq.id] || [];
    L.push("  " + fq.q);
    sels.forEach(i => L.push("    · " + fq.opts[i].text + " [" + fq.opts[i].t + "]"));
  });
  L.push("");
  L.push("— SENARYO SEÇİMLERİ —");
  SCENARIOS.forEach(sc => {
    const s = a.scenarios[sc.id];
    if (typeof s === "number") L.push("  " + sc.q + " → " + sc.opts[s].text + " [" + sc.opts[s].t + "]");
  });
  L.push("");
  L.push("— AÇIK UÇLU CEVAPLAR —");
  OPEN_QS.forEach(o => { L.push("  S: " + o.q); L.push("  C: " + (a.open[o.id] || "(boş)")); });
  L.push("");
  L.push("— TÜM LIKERT CEVAPLARI (0=hiç hoşlanmam ... 4=çok hoşlanırım) —");
  LIKERT_ITEMS.forEach(it => L.push(`  [${it.t}] ${it.text}: ${typeof a.likert[it.id] === "number" ? a.likert[it.id] : "-"}`));
  L.push("");
  L.push("Not: Bu çıktıyı Claude'a yapıştırın — 'Duru Bölüm Okul Seçimi' projesindeki derin analiz için hazırlanmıştır.");
  return L.join("\n");
}

function copyResults(btn) {
  const text = buildExport();
  const done = () => { btn.textContent = "Kopyalandı ✓"; setTimeout(() => { btn.textContent = "Sonuçları Kopyala 📋"; }, 2500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

render();
</script>
</body>
